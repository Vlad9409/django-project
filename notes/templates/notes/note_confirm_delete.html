<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete note</title>
</head>
<body>
    <h1>Delete note</h1>
    <p>Are you sure you want to delete the note? "<strong>{{ note.title }}</strong>"?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes</button>
        <a href="{% url 'home_text' %}">Cancel</a>
    </form>
</body>
</html>
