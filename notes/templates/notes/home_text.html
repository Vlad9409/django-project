{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><Courses></title>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
</head>
<body>
    <h1>{{title}}</h1>
    <p>My notes</p>
    <div class="items-block">
        {% for note in notes %}
        <div class="card">
            <h3>{{note.name}}</h3>
            <p>status: {{note.status}}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
