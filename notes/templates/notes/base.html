<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My notes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home_text' %}">NotesApp</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
    <li class="nav-item">
        <a class="nav-link" href="{% url 'home_text' %}">Main</a>
    </li>
    <li class="nav-item">
        <a class="nav-link btn btn-outline-success ms-2 me-3 text-white" href="{% url 'note_create' %}">Create a note</a>
    </li>

    {% if user.is_authenticated %}
        <li class="nav-item text-light me-3">
            Hello, <strong>{{ user.username }}</strong>!
        </li>
        <li class="nav-item">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
            </form>
        </li>
    {% else %}
        <li class="nav-item">
            <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Login</a>
        </li>
    {% endif %}
</ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
